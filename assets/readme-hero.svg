  <text x="764" y="204" fill="#7BDFF2" font-family="Verdana, Arial, sans-serif" font-size="18" font-weight="700">Agent-ready</text>
  <text x="764" y="232" fill="#F6F9FF" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700">Claude, Codex, Gemini, Cursor</text>

