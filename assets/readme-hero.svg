  <text x="640" y="384" text-anchor="middle" fill="#D9E3F6" font-family="Verdana, Arial, sans-serif" font-size="26">Один продуктовый surface для людей, AI-агентов</text>
  <text x="640" y="418" text-anchor="middle" fill="#D9E3F6" font-family="Verdana, Arial, sans-serif" font-size="26">и MCP-хостов.</text>

