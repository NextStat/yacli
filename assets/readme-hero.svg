  <text x="188" y="372" fill="#D9E3F6" font-family="Verdana, Arial, sans-serif" font-size="27">One product surface for humans, agents, and MCP hosts.</text>

  <rect x="188" y="406" width="292" height="54" rx="14" fill="url(#accent)"/>
  <text x="214" y="440" fill="#16120A" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="800">mail  calendar  disk</text>

