<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="90" y1="40" x2="1180" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4CC"/>
      <stop offset="0.48" stop-color="#D8F3FF"/>
      <stop offset="1" stop-color="#E9E2FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="190" y1="122" x2="1090" y2="510" gradientUnits="userSpaceOnUse">
