[package]
name = "yacli"
version = "0.1.31"
edition = "2024"
license = "MIT"
repository = "https://github.com/NextStat/yacli"
rust-version = "1.85"
description = "Yandex Mail, Calendar, and Disk CLI for humans and AI agents"

[workspace]
members = []

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
toml = "0.8"
url = "2.5"
native-tls = "0.2"
mailparse = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = "0.37"

[dev-dependencies]
assert_cmd = "2.0"
mockito = "1.7"
predicates = "3.1"
